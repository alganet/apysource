# apysource Configuration Example

# ── Paths ─────────────────────────────────────────────────────────────────

project_root = "."
rdf_subdir = "rdf"
sources_cache_subdir = "data/sources"
http_cache_dir = "data/cache"

# ── Constants ────────────────────────────────────────────────────────────

# user_agent intentionally omitted: CachedFetcher derives a version-tracking
# default from apysource.__version__. Set it here only to override.
default_crawl_delay = 3.0
default_http_timeout = 30

# How many documents may be fetched at once. The delay above is enforced *per
# host*, so raising this parallelises a run across the sites it cites and never
# within one of them — a sources file naming twenty domains gets twenty times
# the throughput without asking any single server for more than it was already
# being asked for. 1 is the old serial behaviour exactly.
default_http_workers = 8

# Retried only for 429 and 5xx. A 404 is an answer, not a failure.
default_http_retries = 3
default_http_backoff = 0.5

# How much document text one run may keep in memory. Citations cluster on
# documents, so holding them is what turns "parse this page once per citation"
# into "parse it once".
default_document_cache_bytes = 67108864

# ── URL patterns and base URLs ────────────────────────────────────────────

archive_url_pattern = "archive\\.org/details/(.+?)(?:/|$|\\?|#)"
archive_base_url = "https://archive.org"

gutenberg_url_pattern = "gutenberg\\.org/ebooks/(\\d+)"
gutenberg_base_url = "https://www.gutenberg.org"

wikisource_url_pattern = "wikisource\\.org/wiki/(.+?)(?:\\?|#|$)"
wikisource_base_url = "https://en.wikisource.org"

wiktionary_url_pattern = "wiktionary\\.org/wiki/(.+?)(?:\\?|#|$)"
wiktionary_base_url = "https://en.wiktionary.org"

# Only en-US: translations live in mdn/translated-content, and mapping a
# /fr/docs/ URL into files/fr/ would report every live French page as missing.
mdn_url_pattern = "developer\\.mozilla\\.org/(?i:en-US)/docs/([^#?\\s]+)"
# The ref is part of the URL: put a commit SHA where "main" is to pin the text
# a citation is checked against.
mdn_base_url = "https://raw.githubusercontent.com/mdn/content/main/files"
# raw.githubusercontent is a CDN, not a courtesy-bound origin server. Without a
# per-repo delay, a page set with 60 MDN citations would take three minutes.
mdn_crawl_delay = 0.5

# One document, several renditions, one key: the extension is not part of what
# an RFC *is*, so rfc9110.txt, rfc9110.html and datatracker's /doc/html/rfc9110
# are one cache entry. `/info/rfc9110` is a metadata page and stays unclaimed.
rfc_url_pattern = "(?:rfc-editor\\.org/rfc|datatracker\\.ietf\\.org/doc/html|ietf\\.org/archive/id)/((?:rfc|bcp|std)\\d+|draft-[a-zA-Z0-9][a-zA-Z0-9.\\-]*?)(?:\\.[a-z]+)?(?:$|[/?#])"
rfc_base_url = "https://www.rfc-editor.org/rfc"
# rfc-editor publishes no drafts, and the I-D archive serves a 2012 draft only
# as plain text. Datatracker's rendering of the same draft is the only rendition
# of it that carries section anchors, so that is what an archive URL is answered
# from.
rfc_draft_base_url = "https://datatracker.ietf.org/doc/html"
# Whether an RFC has been replaced is not in the RFC. Its masthead carries the
# documents it *obsoletes*, frozen at publication, and necessarily nothing about
# what obsoleted it. Datatracker's relation API is the forward direction, and it
# is asked one document at a time so a collection citing three RFCs pays for
# three answers rather than for the whole index.
rfc_supersession_base_url = "https://datatracker.ietf.org/api/v1"
# No rfc_crawl_delay, and that is the decision: MDN sets one because
# raw.githubusercontent is a CDN. rfc-editor is a courtesy-bound origin server,
# so this repo takes the registry's default_crawl_delay.

# ── HTTP client ──────────────────────────────────────────────────────────

["apysource.http.CachedFetcher http_client"]
cache_dir = "{http_cache_dir}"
default_delay = "{default_crawl_delay}"
default_timeout = "{default_http_timeout}"
workers = "{default_http_workers}"
retries = "{default_http_retries}"
backoff_factor = "{default_http_backoff}"

# ── Wired repos ───────────────────────────────────────────────────────────

["apysource.repos.archive.ArchiveRepo repo_archive"]
url_pattern = "{archive_url_pattern}"
base_url = "{archive_base_url}"

["apysource.repos.gutenberg.GutenbergRepo repo_gutenberg"]
url_pattern = "{gutenberg_url_pattern}"
base_url = "{gutenberg_base_url}"

["apysource.repos.wikisource.WikisourceRepo repo_wikisource"]
url_pattern = "{wikisource_url_pattern}"
base_url = "{wikisource_base_url}"

["apysource.repos.wiktionary.WiktionaryRepo repo_wiktionary"]
url_pattern = "{wiktionary_url_pattern}"
base_url = "{wiktionary_base_url}"

["apysource.repos.mdn.MdnRepo repo_mdn"]
url_pattern = "{mdn_url_pattern}"
base_url = "{mdn_base_url}"
crawl_delay = "{mdn_crawl_delay}"

["apysource.repos.rfc.RfcRepo repo_rfc"]
url_pattern = "{rfc_url_pattern}"
base_url = "{rfc_base_url}"
draft_base_url = "{rfc_draft_base_url}"
supersession_base_url = "{rfc_supersession_base_url}"

# ── Registry (shared cache_dir, http_client and crawl delay for repos) ───

["apysource.repos.RepoRegistry registry"]
repos = ["{repo_archive}", "{repo_gutenberg}", "{repo_mdn}", "{repo_rfc}", "{repo_wikisource}", "{repo_wiktionary}"]
sources_cache_dir = "{sources_cache_subdir}"
http_client = "{http_client}"
default_crawl_delay = "{default_crawl_delay}"

# ── CLI ───────────────────────────────────────────────────────────────────

["apysource.cli._base.CLIContext ctx"]
project_root = "{project_root}"
rdf_subdir = "{rdf_subdir}"
sources_cache_subdir = "{sources_cache_subdir}"

["apysource.cli.validate.ValidateCommand validate_cmd"]
ctx = "{ctx}"

["apysource.cli.check_sources.CheckSourcesCommand check_sources_cmd"]
ctx = "{ctx}"
registry = "{registry}"
fetcher = "{http_client}"
document_cache_bytes = "{default_document_cache_bytes}"

["apysource.cli.locate.LocateCommand locate_cmd"]
http_client = "{http_client}"

["apysource.cli.add.AddCommand add_cmd"]
http_client = "{http_client}"

# Takes no wiring: a load and a serialize, both of which arrive as arguments.
["apysource.cli.emit.EmitCommand emit_cmd"]
