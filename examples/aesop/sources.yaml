# Aesop's Fables — source verification via YAML.
#
# Uses the Gutenberg repo module. First run fetches and caches; subsequent runs
# verify from cache.
#
# Run: apysource -c apysource.toml check sources.yaml
#
# ── This file used to be wrong, and it is worth saying how ──
#
# It cited `chapter:1` for The Fox and the Grapes. Chapter 1 of this edition is
# the Project Gutenberg title page; the fable is chapter 6. And both snippets
# were from a *different translation* than the one Gutenberg serves — this
# edition opens "A hungry Fox saw some fine bunches of Grapes", not "A Fox one
# day spied a beautiful bunch of ripe Grapes". Neither sentence appears anywhere
# in the book.
#
# So the example that ships with the citation checker was itself two false
# citations: a misattributed location and a misremembered quote, which are
# precisely the two things this tool exists to catch. It went unnoticed because
# the example could not run at all — its config wired no HTTP client, so a cold
# cache died in a traceback before any of it was ever checked.
#
# Both fables are cited by *title* below rather than by chapter number. A chapter
# number is a fact about one edition's typesetting; a title is a fact about the
# fable.

sources:
  - label: "Aesop's Fables"
    url: "https://www.gutenberg.org/ebooks/11339"
    type: text/html
    language: en
    publisher: "Project Gutenberg"
    fragments:
      - label: "The Fox and the Grapes"
        location: "THE FOX AND THE GRAPES"
        snippet: "A hungry Fox saw some fine bunches of Grapes hanging from a vine that was trained along a high trellis"

      - label: "The Hare and the Tortoise"
        location: "THE HARE AND THE TORTOISE"
        snippet: "A Hare was one day making fun of a Tortoise for being so slow upon his feet"
