[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "apysource"
dynamic = ["version"]
description = "Verify that your sources still say what you think they say"
readme = "README.md"
license = "ISC"
authors = [{name = "Alexandre Gomes Gaigalas", email = "alganet@gmail.com"}]
keywords = ["source", "verification", "citation", "quotes", "crawl", "cache"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Markup",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "rdflib>=7.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/alganet/apysource"
Issues = "https://github.com/alganet/apysource/issues"

[project.scripts]
apysource = "apysource.cli.__main__:main"

[project.optional-dependencies]
shacl = ["pyshacl>=0.26"]
dev = [
    "pytest>=9.0",
    "slipcover>=1.0",
    "pyshacl>=0.26",
    "apywire>=1.0",
    "mypy>=1.0",
    "ruff>=0.6",
    "pylode>=3.0,<3.7",
]

[tool.setuptools.dynamic]
version = {attr = "apysource.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["apysource*"]
# `apysource/vocab/` is data, not code. Left to its default (true), namespace
# discovery would find it — no `__init__.py` is required for an implicit
# namespace package — and make it `apysource.vocab`, a package in its own right.
# `package-data` keyed on `apysource` would then no longer cover it, and the
# wheel would ship no shapes at all: silently, with SHACL still reporting
# "SKIPPED (no shapes found)". The fix would look applied and change nothing.
namespaces = false

# The shapes are the Turtle path's only validation, so they have to travel with
# the code. They used to live in a top-level `vocab/`, which `include` above does
# not match — an installed apysource carried no shapes at all, and every SHACL
# run reported "SKIPPED (no shapes found)".
[tool.setuptools.package-data]
apysource = ["vocab/*.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated file — never hand-edit, so don't lint it.
extend-exclude = ["apysource/_defaults.py"]

[tool.ruff.lint]
# Conservative starting set: pyflakes (F) + pycodestyle errors (E).
select = ["E", "F"]

[tool.mypy]
warn_return_any = true
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "apysource._defaults"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["apysource.repos.wiktionary", "apysource.repos.wikisource", "apysource.repos.gutenberg", "apysource.repos.archive", "apysource.repos.gutenberg_bible", "apysource.repos.gutenberg_classical"]
ignore_errors = true
